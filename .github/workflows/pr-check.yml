name: Website PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify static website assets
        run: |
          test -f index.html
          test -f script.js
          test -f styles.css
          test -f support.html
          test -f docs/privacy.html
          test -f docs/terms.html
          test -f assets/screens/home.webp
          test -f assets/og-image.png
